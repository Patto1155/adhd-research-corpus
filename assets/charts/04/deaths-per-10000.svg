<rect x="0.5" y="0.5" width="719" height="653" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="24.0" y="42.0" font-size="18" font-weight="650" fill="#191919" text-anchor="start">In young Danes, about 6 in 10,000 people with ADHD died each year,</text>
<text x="24.0" y="65.4" font-size="18" font-weight="650" fill="#191919" text-anchor="start">against about 2 without</text>
<text x="24.0" y="88.8" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Each grid is 10,000 people followed for one year. A filled dot is one death. Nearly every dot in both</text>
<text x="24.0" y="108.4" font-size="14" font-weight="400" fill="#666666" text-anchor="start">grids is someone who did not die that year.</text>
<text x="24.0" y="147.0" font-size="15" font-weight="650" fill="#191919" text-anchor="start">With ADHD</text>
<text x="24.0" y="167.0" font-size="14" font-weight="400" fill="#666666" text-anchor="start">5.85 per 10,000 person-years</text>
<text x="378.0" y="147.0" font-size="15" font-weight="650" fill="#191919" text-anchor="start">Without ADHD</text>
<text x="378.0" y="167.0" font-size="14" font-weight="400" fill="#666666" text-anchor="start">2.21 per 10,000 person-years</text>
<rect x="24" y="202.0" width="318.0" height="318.0" fill="url(#grid0)"/>
<path d="M24.40,203.50a1.1,1.1 0 1,0 2.2,0a1.1,1.1 0 1,0 -2.2,0M27.40,203.50a1.1,1.1 0 1,0 2.2,0a1.1,1.1 0 1,0 -2.2,0M30.40,203.50a1.1,1.1 0 1,0 2.2,0a1.1,1.1 0 1,0 -2.2,0M33.40,203.50a1.1,1.1 0 1,0 2.2,0a1.1,1.1 0 1,0 -2.2,0M36.40,203.50a1.1,1.1 0 1,0 2.2,0a1.1,1.1 0 1,0 -2.2,0M39.40,203.50a1.1,1.1 0 1,0 2.2,0a1.1,1.1 0 1,0 -2.2,0" fill="#1757ac"/>
<path d="M33.0,202.0 V193.0 H94.0" stroke="#666666" stroke-width="1" fill="none"/>
<text x="98.0" y="197.0" font-size="13" font-weight="600" fill="#191919" text-anchor="start">about 6 deaths</text>
<rect x="378.0" y="202.0" width="318.0" height="318.0" fill="url(#grid1)"/>
<path d="M378.40,203.50a1.1,1.1 0 1,0 2.2,0a1.1,1.1 0 1,0 -2.2,0M381.40,203.50a1.1,1.1 0 1,0 2.2,0a1.1,1.1 0 1,0 -2.2,0" fill="#1757ac"/>
<path d="M381.0,202.0 V193.0 H448.0" stroke="#666666" stroke-width="1" fill="none"/>
<text x="452.0" y="197.0" font-size="13" font-weight="600" fill="#191919" text-anchor="start">about 2 deaths</text>
<text x="24.0" y="552.0" font-size="14" font-weight="400" fill="#191919" text-anchor="start">In relative terms: a rate ratio of 2.07 after adjustment, and 1.50 after removing people who also</text>
<text x="24.0" y="571.6" font-size="14" font-weight="400" fill="#191919" text-anchor="start">had oppositional defiant, conduct or substance use disorders.</text>
<line x1="24" x2="696" y1="591.2" y2="591.2" stroke="#e7e7e7" stroke-width="1"/>
<text x="24.0" y="612.2" font-size="13" font-weight="400" fill="#666666" text-anchor="start">Source: Dalsgaard et al., Lancet 2015 [1]. Danish national registry, about 1.92 million people, 32,061 with</text>
<text x="24.0" y="630.4" font-size="13" font-weight="400" fill="#666666" text-anchor="start">ADHD; oldest aged 32. Group averages, not a prediction for any person.</text>
</svg>
