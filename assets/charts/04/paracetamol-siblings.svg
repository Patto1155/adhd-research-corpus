<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="720" height="344" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title id="t">Paracetamol in pregnancy: a small raw gap that disappeared when siblings were compared</title>
<desc id="d">Two bars. Among 2.48 million Swedish children, 2.87% of those exposed to paracetamol before birth had an ADHD diagnosis by age 10, against 2.46% of those not exposed. Comparing siblings, the hazard ratio was 0.98, meaning no difference.</desc>
<rect x="0.5" y="0.5" width="719" height="343" rx="12" fill="#ffffff" stroke="#dce2e7" stroke-width="1"/>
<text x="24.0" y="40.0" font-size="18" font-weight="600" fill="#182026" text-anchor="start">Paracetamol in pregnancy: a small raw gap</text>
<text x="24.0" y="64.0" font-size="18" font-weight="600" fill="#182026" text-anchor="start">that disappeared when siblings were compared</text>
<text x="24.0" y="90.0" font-size="14" font-weight="400" fill="#4f5b66" text-anchor="start">Share of 2.48 million Swedish children with an ADHD diagnosis by age 10.</text>
<line x1="154.0" x2="154.0" y1="116.0" y2="166.0" stroke="#b9c3cc" stroke-width="1"/>
<text x="154.0" y="184.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="middle">0%</text>
<line x1="259.5" x2="259.5" y1="116.0" y2="166.0" stroke="#e6eaee" stroke-width="1"/>
<text x="259.5" y="184.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="middle">1%</text>
<line x1="365.0" x2="365.0" y1="116.0" y2="166.0" stroke="#e6eaee" stroke-width="1"/>
<text x="365.0" y="184.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="middle">2%</text>
<line x1="470.5" x2="470.5" y1="116.0" y2="166.0" stroke="#e6eaee" stroke-width="1"/>
<text x="470.5" y="184.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="middle">3%</text>
<line x1="576.0" x2="576.0" y1="116.0" y2="166.0" stroke="#e6eaee" stroke-width="1"/>
<text x="576.0" y="184.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="middle">4%</text>
<text x="24.0" y="146.0" font-size="14" font-weight="600" fill="#182026" text-anchor="start">By age 10</text>
<path d="M154.00,120.00 H452.79 Q456.79,120.00 456.79,124.00 V134.00 Q456.79,138.00 452.79,138.00 H154.00 Z" fill="#257de0"/>
<text x="464.8" y="134.0" font-size="14" font-weight="600" fill="#182026" text-anchor="start">2.87% exposed before birth</text>
<path d="M154.00,144.00 H409.53 Q413.53,144.00 413.53,148.00 V158.00 Q413.53,162.00 409.53,162.00 H154.00 Z" fill="#8b959e"/>
<text x="421.5" y="158.0" font-size="14" font-weight="400" fill="#182026" text-anchor="start">2.46% not exposed</text>
<rect x="24" y="210" width="672" height="58" rx="6" fill="#f3f7fd"/>
<text x="40.0" y="234.0" font-size="14" font-weight="400" fill="#182026" text-anchor="start">Comparing brothers and sisters, one exposed and one not:</text>
<text x="40.0" y="255.0" font-size="14" font-weight="600" fill="#182026" text-anchor="start">hazard ratio 0.98, no difference.</text>
<line x1="24" x2="696" y1="284.0" y2="284.0" stroke="#e6eaee" stroke-width="1"/>
<text x="24.0" y="308.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="start">Source: Ahlqvist et al. [3]. Swedish national registry. Sibling comparisons account for family factors that</text>
<text x="24.0" y="326.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="start">siblings share.</text>
</svg>
