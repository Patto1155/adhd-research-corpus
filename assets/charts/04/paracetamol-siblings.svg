<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 341" width="720" height="341" role="img" aria-labelledby="title desc" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>
<title id="title">Paracetamol in pregnancy: a small raw gap that disappeared when siblings were compared</title>
<desc id="desc">Two bars. Among 2.48 million Swedish children, 2.87% of those exposed to paracetamol before birth had an ADHD diagnosis by age 10, against 2.46% of those not exposed. Comparing siblings, the hazard ratio was 0.98, meaning no difference.</desc>
<rect x="0.5" y="0.5" width="719" height="340" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="24.0" y="42.0" font-size="18" font-weight="650" fill="#191919" text-anchor="start">Paracetamol in pregnancy: a small raw gap that disappeared when siblings</text>
<text x="24.0" y="65.4" font-size="18" font-weight="650" fill="#191919" text-anchor="start">were compared</text>
<text x="24.0" y="88.8" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Share of 2.48 million Swedish children with an ADHD diagnosis by age 10.</text>
<line x1="154.0" x2="154.0" y1="112.4" y2="162.4" stroke="#c2c2c2" stroke-width="1"/>
<text x="154.0" y="180.4" font-size="13" font-weight="400" fill="#666666" text-anchor="middle">0%</text>
<line x1="259.5" x2="259.5" y1="112.4" y2="162.4" stroke="#e7e7e7" stroke-width="1"/>
<text x="259.5" y="180.4" font-size="13" font-weight="400" fill="#666666" text-anchor="middle">1%</text>
<line x1="365.0" x2="365.0" y1="112.4" y2="162.4" stroke="#e7e7e7" stroke-width="1"/>
<text x="365.0" y="180.4" font-size="13" font-weight="400" fill="#666666" text-anchor="middle">2%</text>
<line x1="470.5" x2="470.5" y1="112.4" y2="162.4" stroke="#e7e7e7" stroke-width="1"/>
<text x="470.5" y="180.4" font-size="13" font-weight="400" fill="#666666" text-anchor="middle">3%</text>
<line x1="576.0" x2="576.0" y1="112.4" y2="162.4" stroke="#e7e7e7" stroke-width="1"/>
<text x="576.0" y="180.4" font-size="13" font-weight="400" fill="#666666" text-anchor="middle">4%</text>
<text x="24.0" y="142.4" font-size="14" font-weight="600" fill="#191919" text-anchor="start">By age 10</text>
<path d="M154.00,116.40 H452.79 Q456.79,116.40 456.79,120.40 V130.40 Q456.79,134.40 452.79,134.40 H154.00 Z" fill="#257de0"/>
<text x="464.8" y="130.4" font-size="14" font-weight="600" fill="#191919" text-anchor="start">2.87% exposed before birth</text>
<path d="M154.00,140.40 H409.53 Q413.53,140.40 413.53,144.40 V154.40 Q413.53,158.40 409.53,158.40 H154.00 Z" fill="#8a8a8a"/>
<text x="421.5" y="154.4" font-size="14" font-weight="400" fill="#191919" text-anchor="start">2.46% not exposed</text>
<rect x="24" y="206.4" width="672" height="58" rx="6" fill="#f3f7fd"/>
<text x="40.0" y="230.4" font-size="14" font-weight="400" fill="#191919" text-anchor="start">Comparing brothers and sisters, one exposed and one not:</text>
<text x="40.0" y="251.4" font-size="14" font-weight="650" fill="#191919" text-anchor="start">hazard ratio 0.98, no difference.</text>
<line x1="24" x2="696" y1="278.4" y2="278.4" stroke="#e7e7e7" stroke-width="1"/>
<text x="24.0" y="299.4" font-size="13" font-weight="400" fill="#666666" text-anchor="start">Source: Ahlqvist et al. [3]. Swedish national registry. Sibling comparisons account for family factors that</text>
<text x="24.0" y="317.6" font-size="13" font-weight="400" fill="#666666" text-anchor="start">siblings share.</text>
</svg>
