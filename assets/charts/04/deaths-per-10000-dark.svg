<path d="M33.0,186.0 V177.0 H94.0" stroke="#a3aeb7" stroke-width="1" fill="none"/>
<text x="98.0" y="181.0" font-size="13" font-weight="600" fill="#e8edf0" text-anchor="start">about 6 deaths</text>
<rect x="378.0" y="186" width="318.0" height="318.0" fill="url(#grid1)"/>
