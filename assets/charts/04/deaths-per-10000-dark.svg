<rect x="0.5" y="0.5" width="719" height="656" rx="12" fill="#171c20" stroke="#2a3238" stroke-width="1"/>
<text x="24.0" y="40.0" font-size="18" font-weight="600" fill="#e8edf0" text-anchor="start">In young Danes, about 6 in 10,000 people with</text>
<text x="24.0" y="64.0" font-size="18" font-weight="600" fill="#e8edf0" text-anchor="start">ADHD died each year, against about 2 without</text>
<text x="24.0" y="90.0" font-size="14" font-weight="400" fill="#a3aeb7" text-anchor="start">Each grid is 10,000 people followed for one year; a filled dot is one death.</text>
<text x="24.0" y="131.0" font-size="15" font-weight="600" fill="#e8edf0" text-anchor="start">With ADHD</text>
<text x="24.0" y="151.0" font-size="14" font-weight="400" fill="#a3aeb7" text-anchor="start">5.85 per 10,000 person-years</text>
<text x="378.0" y="131.0" font-size="15" font-weight="600" fill="#e8edf0" text-anchor="start">Without ADHD</text>
<text x="378.0" y="151.0" font-size="14" font-weight="400" fill="#a3aeb7" text-anchor="start">2.21 per 10,000 person-years</text>
<rect x="24" y="186" width="318.0" height="318.0" fill="url(#grid0)"/>
