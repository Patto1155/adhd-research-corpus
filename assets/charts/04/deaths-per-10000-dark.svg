<text x="452.0" y="181.0" font-size="13" font-weight="600" fill="#e8edf0" text-anchor="start">about 2 deaths</text>
<text x="24.0" y="536.0" font-size="14" font-weight="400" fill="#e8edf0" text-anchor="start">Nearly every dot in both grids is someone who did not die that year. In relative terms: a rate ratio of</text>
<text x="24.0" y="555.6" font-size="14" font-weight="400" fill="#e8edf0" text-anchor="start">2.07 after adjustment, and 1.50 after removing people who also had oppositional defiant, conduct or</text>
<text x="24.0" y="575.2" font-size="14" font-weight="400" fill="#e8edf0" text-anchor="start">substance use disorders.</text>
<line x1="24" x2="696" y1="596.8" y2="596.8" stroke="#283037" stroke-width="1"/>
<text x="24.0" y="620.8" font-size="13" font-weight="400" fill="#a3aeb7" text-anchor="start">Source: Dalsgaard et al., Lancet 2015 [1]. Danish national registry, about 1.92 million people, 32,061 with</text>
<text x="24.0" y="638.8" font-size="13" font-weight="400" fill="#a3aeb7" text-anchor="start">ADHD; oldest aged 32. Group averages, not a prediction for any person.</text>
