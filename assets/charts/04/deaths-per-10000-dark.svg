<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 657" width="720" height="657" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title id="t">In young Danes, about 6 in 10,000 people with ADHD died each year, against about 2 without</title>
<desc id="d">Two grids of 10,000 dots, each standing for 10,000 people followed for one year. In the grid for people with ADHD, 6 dots are filled (5.85 deaths per 10,000 person-years); in the grid for people without ADHD, 2 dots are filled (2.21 per 10,000 person-years). Rate ratio 2.07 after adjustment, falling to 1.50 when people who also had oppositional defiant disorder, conduct disorder or a substance use disorder were removed. Danish registry study of about 1.92 million people; the cohort was aged 32 or under.</desc>
<defs><pattern id="grid0" x="24" y="186" width="32.0" height="32.0" patternUnits="userSpaceOnUse"><g fill="#2c343a"><circle cx="1.50" cy="1.50" r="1.1"/><circle cx="4.50" cy="1.50" r="1.1"/><circle cx="7.50" cy="1.50" r="1.1"/><circle cx="10.50" cy="1.50" r="1.1"/><circle cx="13.50" cy="1.50" r="1.1"/><circle cx="16.50" cy="1.50" r="1.1"/><circle cx="19.50" cy="1.50" r="1.1"/><circle cx="22.50" cy="1.50" r="1.1"/><circle cx="25.50" cy="1.50" r="1.1"/><circle cx="28.50" cy="1.50" r="1.1"/><circle cx="1.50" cy="4.50" r="1.1"/><circle cx="4.50" cy="4.50" r="1.1"/><circle cx="7.50" cy="4.50" r="1.1"/><circle cx="10.50" cy="4.50" r="1.1"/><circle cx="13.50" cy="4.50" r="1.1"/><circle cx="16.50" cy="4.50" r="1.1"/><circle cx="19.50" cy="4.50" r="1.1"/><circle cx="22.50" cy="4.50" r="1.1"/><circle cx="25.50" cy="4.50" r="1.1"/><circle cx="28.50" cy="4.50" r="1.1"/><circle cx="1.50" cy="7.50" r="1.1"/><circle cx="4.50" cy="7.50" r="1.1"/><circle cx="7.50" cy="7.50" r="1.1"/><circle cx="10.50" cy="7.50" r="1.1"/><circle cx="13.50" cy="7.50" r="1.1"/><circle cx="16.50" cy="7.50" r="1.1"/><circle cx="19.50" cy="7.50" r="1.1"/><circle cx="22.50" cy="7.50" r="1.1"/><circle cx="25.50" cy="7.50" r="1.1"/><circle cx="28.50" cy="7.50" r="1.1"/><circle cx="1.50" cy="10.50" r="1.1"/><circle cx="4.50" cy="10.50" r="1.1"/><circle cx="7.50" cy="10.50" r="1.1"/><circle cx="10.50" cy="10.50" r="1.1"/><circle cx="13.50" cy="10.50" r="1.1"/><circle cx="16.50" cy="10.50" r="1.1"/><circle cx="19.50" cy="10.50" r="1.1"/><circle cx="22.50" cy="10.50" r="1.1"/><circle cx="25.50" cy="10.50" r="1.1"/><circle cx="28.50" cy="10.50" r="1.1"/><circle cx="1.50" cy="13.50" r="1.1"/><circle cx="4.50" cy="13.50" r="1.1"/><circle cx="7.50" cy="13.50" r="1.1"/><circle cx="10.50" cy="13.50" r="1.1"/><circle cx="13.50" cy="13.50" r="1.1"/><circle cx="16.50" cy="13.50" r="1.1"/><circle cx="19.50" cy="13.50" r="1.1"/><circle cx="22.50" cy="13.50" r="1.1"/><circle cx="25.50" cy="13.50" r="1.1"/><circle cx="28.50"