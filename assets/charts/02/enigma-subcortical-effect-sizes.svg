<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 524" width="720" height="524" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title id="t">Deep brain structures differ only slightly in ADHD, on average</title>
<desc id="d">Dot plot of ENIGMA-ADHD effect sizes (Cohen's d), all between -0.10 and -0.19, inside the conventional 'small' threshold of 0.2.</desc>
<rect x="0.5" y="0.5" width="719" height="523" rx="12" fill="#ffffff" stroke="#dce2e7" stroke-width="1"/>
<text x="24.0" y="40.0" font-size="18" font-weight="600" fill="#182026" text-anchor="start">Deep brain structures were only very slightly</text>
<text x="24.0" y="64.0" font-size="18" font-weight="600" fill="#182026" text-anchor="start">smaller, on average, in the ADHD group</text>
<text x="24.0" y="90.0" font-size="14" font-weight="400" fill="#4f5b66" text-anchor="start">Cohen’s d for 1,713 people with ADHD vs 1,529 without. Every value is under 0.2.</text>
