<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 526" width="720" height="526" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title id="t">Deep brain structures differ only slightly in ADHD, on average</title>
<desc id="d">Dot plot of ENIGMA-ADHD effect sizes (Cohen's d), all between -0.10 and -0.19, inside the conventional 'small' threshold of 0.2.</desc>
<rect x="0.5" y="0.5" width="719" height="525" rx="8" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
<text x="24.0" y="34.0" font-size="18" fill="#191919" text-anchor="start" font-weight="600">Deep brain structures were only very slightly smaller,</text>
<text x="24.0" y="58.0" font-size="18" fill="#191919" text-anchor="start" font-weight="600">on average, in the ADHD group</text>
<text x="24.0" y="84.0" font-size="14" fill="#666666" text-anchor="start" font-weight="400">Effect size (Cohen’s d) for 1,713 people with ADHD vs 1,529 without.</text>
<text x="24.0" y="104.0" font-size="14" fill="#666666" text-anchor="start" font-weight="400">Every value is smaller than 0.2, the conventional “small” effect.</text>
<text x="580.0" y="142.0" font-size="13" fill="#666666" text-anchor="start" font-weight="400">Groups overlap</text>
