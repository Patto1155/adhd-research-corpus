<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 434" width="720" height="434" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title id="t">Brain-scan classifiers are only a little better than chance</title>
<desc id="d">Two scales. Accuracy: careful studies 60-80% vs 50% coin toss and an 80% proposed bar. AUROC: best ABCD structural model 0.567 vs 0.5 chance and 1.0 perfect.</desc>
<rect x="0.5" y="0.5" width="719" height="433" rx="12" fill="#ffffff" stroke="#dce2e7" stroke-width="1"/>
<text x="24.0" y="40.0" font-size="18" font-weight="600" fill="#182026" text-anchor="start">Scan-based classifiers sit closer to a</text>
<text x="24.0" y="64.0" font-size="18" font-weight="600" fill="#182026" text-anchor="start">coin toss than to a usable diagnostic test</text>
<text x="24.0" y="90.0" font-size="14" font-weight="400" fill="#4f5b66" text-anchor="start">Two measures, each on its own scale.</text>
<text x="24.0" y="120.0" font-size="14" fill="#182026" text-anchor="start" font-weight="600">Accuracy in studies that tested on separate data (review of 69 studies)</text>
<line x1="40.0" y1="158.0" x2="40.0" y2="196.0" stroke="#e6eaee" stroke-width="1" stroke-linecap="butt"/>
<text x="40.0" y="216.0" font-size="13" fill="#4f5b66" text-anchor="middle" font-weight="400">0%</text>
<line x1="180.0" y1="158.0" x2="180.0" y2="196.0" stroke="#e6eaee" stroke-width="1" stroke-linecap="butt"/>
<text x="180.0" y="216.0" font-size="13" fill="#4f5b66" text-anchor="middle" font-weight="400">25%</text>
<line x1="320.0" y1="158.0" x2="320.0" y2="196.0" stroke="#e6eaee" stroke-width="1" stroke-linecap="butt"/>
<text x="320.0" y="216.0" font-size="13" fill="#4f5b66" text-anchor="middle" font-weight="400">50%</text>
<line x1="460.0" y1="158.0" x2="460.0" y2="196.0" stroke="#e6eaee" stroke-width="1" stroke-linecap="butt"/>
<text x="460.0" y="216.0" font-size="13" fill="#4f5b66" text-anchor="middle" font-weight="400">75%</text>
<line x1="600.0" y1="158.0" x2="600.0" y2="196.0" stroke="#e6eaee" stroke-width="1" stroke-linecap="butt"/>
<text x="600.0" y="216.0" font-size="13" fill="#4f5b66" text-anchor="middle" font-weight="400">100%</text>
<line x1="40.0" y1="196.0" x2="600.0" y2="196.0" stroke="#b9c3cc" stroke-width="1" stroke-linecap="butt"/>
<rect x="376.0" y="178.0" width="112.0" height="12" rx="6.0" fill="#257de0" fill-opacity="1.0"/>
<text x="432.0" y="168.0" font-size="14" fill="#182026" text-anchor="middle" font-weight="400">mostly 60–80%</text>
<line x1="320.0" y1="154.0" x2="320.0" y2="196.0" stroke="#4f5b66" stroke-width="1.5" stroke-linecap="butt"/>
<text x="312.0" y="150.0" font-size="13" fill="#4f5b66" text-anchor="end" font-weight="400">coin toss, 50%</text>
<line x1="488.0" y1="154.0" x2="488.0" y2="196.0" stroke="#182026" stroke-width="1.5" stroke-linecap="butt"/>
<text x="496.0" y="150.0" font-size="13" fill="#182026" text-anchor="start" font-weight="400">proposed bar for a test: 80%</text>
<text x="496.0" y="166.0" font-size="13" fill="#4f5b66" text-anchor="start" font-weight="400">sensitivity and specificity</text>
<text x="24.0" y="258.0" font-size="14" fill="#182026" text-anchor="start" font-weight="600">AUROC of the best structural-scan model, 6,916 children (ABCD Study)</text>
<line x1="40.0" y1="296.0" x2="40.0" y2="334.0" stroke="#e6eaee" stroke-width="1" stroke-linecap="butt"/>
<text x="40.0" y="354.0" font-size="13" fill="#4f5b66" text-anchor="middle" font-weight="400">0.5</text>
<line x1="152.0" y1="296.0" x2="152.0" y2="334.0" stroke="#e6eaee" stroke-width="1" stroke-linecap="butt"/>
<text x="152.0" y="354.0" font-size="13" fill="#4f5b66" text-anchor="middle" font-weight="400">0.6</text>
<line x1="264.0" y1="296.0" x2="264.0" y2="334.0" stroke="#e6eaee" stroke-width="1" stroke-linecap="butt"/>
<text x="264.0" y="354.0" font-size="13" fill="#4f5b66" text-anchor="middle" font-weight="400">0.7</text>
<line x1="376.0" y1="296.0" x2="376.0" y2="334.0" stroke="#e6eaee" stroke-width="1" stroke-linecap="butt"/>
<text x="376.0" y="354.0" font-size="13" fill="#4f5b66" text-anchor="middle" font-weight="400">0.8</text>
<line x1="488.0" y1="296.0" x2="488.0" y2="334.0" stroke="#e6eaee" stroke-width="1" stroke-linecap="butt"/>
<text x="488.0" y="354.0" font-size="13" fill="#4f5b66" text-anchor="middle" font-weight="400">0.9</text>
<line x1="600.0" y1="296.0" x2="600.0" y2="334.0" stroke="#e6eaee" stroke-width="1" stroke-linecap="butt"/>
<text x="600.0" y="354.0" font-size="13" fill="#4f5b66" text-anchor="middle" font-weight="400">1.0</text>
<line x1="40.0" y1="334.0" x2="600.0" y2="334.0" stroke="#b9c3cc" stroke-width="1" stroke-linecap="butt"/>
<line x1="40.0" y1="322.0" x2="115.0" y2="322.0" stroke="#257de0" stroke-width="2" stroke-linecap="round"/>
<circle cx="115.0" cy="322.0" r="6" fill="#257de0" stroke="#ffffff" stroke-width="2"/>
<text x="127.0" y="327.0" font-size="14" fill="#182026" text-anchor="start" font-weight="600">0.567</text>
<text x="44.0" y="306.0" font-size="13" fill="#4f5b66" text-anchor="start" font-weight="400">0.5 = coin toss</text>
<text x="600.0" y="306.0" font-size="13" fill="#4f5b66" text-anchor="end" font-weight="400">1.0 = perfect</text>
<line x1="24" x2="696" y1="374.0" y2="374.0" stroke="#e6eaee" stroke-width="1"/>
<text x="24.0" y="398.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="start">Sources: Pulini et al. 2019 (source 19), APA work group 2012 (24) and Gaus et al. 2023 (21),</text>
<text x="24.0" y="416.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="start">see this page. The proposed bar is 80% sensitivity and 80% specificity, not accuracy itself.</text>
</svg>
