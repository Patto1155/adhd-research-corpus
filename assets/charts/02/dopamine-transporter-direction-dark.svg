<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 376" width="720" height="376" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title id="t">Dopamine transporter studies disagree on direction</title>
<desc id="d">Diverging bars: one PET study about 11% lower in ADHD; a meta-analysis of 9 studies 14% higher.</desc>
<rect x="0.5" y="0.5" width="719" height="375" rx="12" fill="#171c20" stroke="#2a3238" stroke-width="1"/>
<text x="24.0" y="40.0" font-size="18" font-weight="600" fill="#e8edf0" text-anchor="start">Dopamine transporter scans point in opposite</text>
<text x="24.0" y="64.0" font-size="18" font-weight="600" fill="#e8edf0" text-anchor="start">directions, so they cannot show a “deficiency”</text>
<text x="24.0" y="90.0" font-size="14" font-weight="400" fill="#a3aeb7" text-anchor="start">Average dopamine transporter level in ADHD compared with people without ADHD.</text>
<line x1="360.0" y1="120.0" x2="360.0" y2="254.0" stroke="#283037" stroke-width="1" stroke-linecap="butt"/>
<line x1="413.3" y1="120.0" x2="413.3" y2="254.0" stroke="#283037" stroke-width="1" stroke-linecap="butt"/>
<line x1="466.7" y1="120.0" x2="466.7" y2="254.0" stroke="#283037" stroke-width="1" stroke-linecap="butt"/>
<line x1="573.3" y1="120.0" x2="573.3" y2="254.0" stroke="#283037" stroke-width="1" stroke-linecap="butt"/>
<line x1="626.7" y1="120.0" x2="626.7" y2="254.0" stroke="#283037" stroke-width="1" stroke-linecap="butt"/>
<line x1="680.0" y1="120.0" x2="680.0" y2="254.0" stroke="#283037" stroke-width="1" stroke-linecap="butt"/>
<line x1="520.0" y1="120.0" x2="520.0" y2="254.0" stroke="#46515a" stroke-width="1.5" stroke-linecap="butt"/>
<text x="360.0" y="274.0" font-size="13" fill="#a3aeb7" text-anchor="middle" font-weight="400">−30%</text>
<text x="413.3" y="274.0" font-size="13" fill="#a3aeb7" text-anchor="middle" font-weight="400">−20%</text>
<text x="466.7" y="274.0" font-size="13" fill="#a3aeb7" text-anchor="middle" font-weight="400">−10%</text>
<text x="520.0" y="274.0" font-size="13" fill="#a3aeb7" text-anchor="middle" font-weight="400">0</text>
<text x="573.3" y="274.0" font-size="13" fill="#a3aeb7" text-anchor="middle" font-weight="400">+10%</text>
<text x="626.7" y="274.0" font-size="13" fill="#a3aeb7" text-anchor="middle" font-weight="400">+20%</text>
<text x="680.0" y="274.0" font-size="13" fill="#a3aeb7" text-anchor="middle" font-weight="400">+30%</text>
<text x="360.0" y="296.0" font-size="13" fill="#a3aeb7" text-anchor="start" font-weight="400">← lower in ADHD</text>
<text x="680.0" y="296.0" font-size="13" fill="#a3aeb7" text-anchor="end" font-weight="400">higher in ADHD →</text>
<text x="24.0" y="156.0" font-size="14" fill="#e8edf0" text-anchor="start" font-weight="400">One PET study, never-medicated adults</text>
<text x="24.0" y="174.0" font-size="13" fill="#a3aeb7" text-anchor="start" font-weight="400">53 with ADHD vs 44 without; nucleus accumbens</text>
<path d="M520.0,146.0 H465.3 Q461.3,146.0 461.3,150.0 V166.0 Q461.3,170.0 465.3,170.0 H520.0 Z" fill="#338ced"/>
<text x="453.3" y="163.0" font-size="14" fill="#e8edf0" text-anchor="end" font-weight="600" stroke="#171c20" stroke-width="4" stroke-linejoin="round" paint-order="stroke">about 11% lower</text>
<text x="24.0" y="220.0" font-size="14" fill="#e8edf0" text-anchor="start" font-weight="400">Pooled 9 PET and SPECT studies</text>
<text x="24.0" y="238.0" font-size="13" fill="#a3aeb7" text-anchor="start" font-weight="400">169 with ADHD vs 173 without; striatum</text>
<path d="M520.0,210.0 H590.7 Q594.7,210.0 594.7,214.0 V230.0 Q594.7,234.0 590.7,234.0 H520.0 Z" fill="#338ced"/>
<text x="602.7" y="227.0" font-size="14" fill="#e8edf0" text-anchor="start" font-weight="600">14% higher</text>
<line x1="24" x2="696" y1="316.0" y2="316.0" stroke="#283037" stroke-width="1"/>
<text x="24.0" y="340.0" font-size="13" font-weight="400" fill="#a3aeb7" text-anchor="start">Sources: Volkow et al. 2009, JAMA (source 1) and Fusar-Poli et al. 2012 (source 3), see this page.</text>
<text x="24.0" y="358.0" font-size="13" font-weight="400" fill="#a3aeb7" text-anchor="start">The 11% is this page’s calculation from the paper’s figures (0.63 vs 0.71).</text>
</svg>
