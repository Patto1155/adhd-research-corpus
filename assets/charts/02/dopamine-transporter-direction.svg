<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 364" width="720" height="364" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title id="t">Dopamine transporter studies disagree on direction</title>
<desc id="d">Diverging bars: one PET study about 11% lower in ADHD; a meta-analysis of 9 studies 14% higher.</desc>
<rect x="0.5" y="0.5" width="719" height="363" rx="8" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
<text x="24.0" y="34.0" font-size="18" fill="#191919" text-anchor="start" font-weight="600">Dopamine transporter scans point in opposite</text>
<text x="24.0" y="58.0" font-size="18" fill="#191919" text-anchor="start" font-weight="600">directions, so they cannot show a “deficiency”</text>
<text x="24.0" y="84.0" font-size="14" fill="#666666" text-anchor="start" font-weight="400">Average dopamine transporter level in ADHD compared with people without ADHD.</text>
<line x1="360.0" y1="122.0" x2="360.0" y2="256.0" stroke="#e7e7e7" stroke-width="1" stroke-linecap="butt"/>
<line x1="413.3" y1="122.0" x2="413.3" y2="256.0" stroke="#e7e7e7" stroke-width="1" stroke-linecap="butt"/>
<line x1="466.7" y1="122.0" x2="466.7" y2="256.0" stroke="#e7e7e7" stroke-width="1" stroke-linecap="butt"/>
<line x1="573.3" y1="122.0" x2="573.3" y2="256.0" stroke="#e7e7e7" stroke-width="1" stroke-linecap="butt"/>
<line x1="626.7" y1="122.0" x2="626.7" y2="256.0" stroke="#e7e7e7" stroke-width="1" stroke-linecap="butt"/>
<line x1="680.0" y1="122.0" x2="680.0" y2="256.0" stroke="#e7e7e7" stroke-width="1" stroke-linecap="butt"/>
<line x1="520.0" y1="122.0" x2="520.0" y2="256.0" stroke="#c2c2c2" stroke-width="1.5" stroke-linecap="butt"/>
<text x="360.0" y="276.0" font-size="13" fill="#666666" text-anchor="middle" font-weight="400">−30%</text>
<text x="413.3" y="276.0" font-size="13" fill="#666666" text-anchor="middle" font-weight="400">−20%</text>
<text x="466.7" y="276.0" font-size="13" fill="#666666" text-anchor="middle" font-weight="400">−10%</text>
<text x="520.0" y="276.0" font-size="13" fill="#666666" text-anchor="middle" font-weight="400">0</text>
<text x="573.3" y="276.0" font-size="13" fill="#666666" text-anchor="middle" font-weight="400">+10%</text>
<text x="626.7" y="276.0" font-size="13" fill="#666666" text-anchor="middle" font-weight="400">+20%</text>
<text x="680.0" y="276.0" font-size="13" fill="#666666" text-anchor="middle" font-weight="400">+30%</text>
<text x="360.0" y="298.0" font-size="13" fill="#666666" text-anchor="start" font-weight="400">← lower in ADHD</text>
<text x="680.0" y="298.0" font-size="13" fill="#666666" text-anchor="end" font-weight="400">higher in ADHD →</text>
<text x="24.0" y="158.0" font-size="14" fill="#191919" text-anchor="start" font-weight="400">One PET study, never-medicated adults</text>
<text x="24.0" y="176.0" font-size="13" fill="#666666" text-anchor="start" font-weight="400">53 with ADHD vs 44 without; nucleus accumbens</text>
<path d="M520.0,148.0 H465.3 Q461.3,148.0 461.3,152.0 V168.0 Q461.3,172.0 465.3,172.0 H520.0 Z" fill="#257de0"/>
<text x="453.3" y="165.0" font-size="13" fill="#191919" text-anchor="end" font-weight="400">about 11% lower</text>
<text x="24.0" y="222.0" font-size="14" fill="#191919" text-anchor="start" font-weight="400">Pooled 9 PET and SPECT studies</text>
<text x="24.0" y="240.0" font-size="13" fill="#666666" text-anchor="start" font-weight="400">169 with ADHD vs 173 without; striatum</text>
<path d="M520.0,212.0 H590.7 Q594.7,212.0 594.7,216.0 V232.0 Q594.7,236.0 590.7,236.0 H520.0 Z" fill="#257de0"/>
<text x="602.7" y="229.0" font-size="13" fill="#191919" text-anchor="start" font-weight="400">14% higher</text>
<text x="24.0" y="328.0" font-size="13" fill="#666666" text-anchor="start" font-weight="400">Sources: Volkow et al. 2009, JAMA (source 1) and Fusar-Poli et al. 2012 (source 3), see this page.</text>
<text x="24.0" y="346.0" font-size="13" fill="#666666" text-anchor="start" font-weight="400">The 11% is this page’s calculation from the paper’s figures (0.63 vs 0.71).</text>
</svg>
