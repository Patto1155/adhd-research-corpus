<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title id="t">Executive-function gaps are medium-sized in children and adults</title>
<desc id="d">Dot plot of effect sizes (d) for ADHD vs comparison groups: children 0.43 to 1.06, adults 0.57 to 0.89.</desc>
<rect x="0.5" y="0.5" width="719" height="639" rx="8" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
<text x="24.0" y="34.0" font-size="18" fill="#191919" text-anchor="start" font-weight="600">On average, executive gaps are medium-sized,</text>
<text x="24.0" y="58.0" font-size="18" fill="#191919" text-anchor="start" font-weight="600">in children and in adults</text>
<text x="24.0" y="84.0" font-size="14" fill="#666666" text-anchor="start" font-weight="400">Effect size (d): how far apart the group averages are, in standard deviations.</text>
<text x="24.0" y="104.0" font-size="14" fill="#666666" text-anchor="start" font-weight="400">Further right = weaker average performance in the ADHD group.</text>
