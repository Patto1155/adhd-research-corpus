<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 454" width="720" height="454" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title id="t">Reaction times vary more in ADHD, but not much more than in other conditions</title>
<desc id="d">Dot plot of Hedges' g for reaction-time variability: 0.76 children vs peers, 0.46 adults vs peers, 0.25 children vs other clinical groups; teenagers and adults not distinguishable from other clinical groups.</desc>
<rect x="0.5" y="0.5" width="719" height="453" rx="12" fill="#ffffff" stroke="#dce2e7" stroke-width="1"/>
<text x="24.0" y="40.0" font-size="18" font-weight="600" fill="#182026" text-anchor="start">Reaction times are more variable in ADHD,</text>
<text x="24.0" y="64.0" font-size="18" font-weight="600" fill="#182026" text-anchor="start">but only slightly more than in other conditions</text>
<text x="24.0" y="90.0" font-size="14" font-weight="400" fill="#4f5b66" text-anchor="start">Trial-to-trial reaction-time variability, effect size (g), from 319 studies.</text>
<line x1="392.0" y1="124.0" x2="392.0" y2="350.0" stroke="#e6eaee" stroke-width="1" stroke-linecap="butt"/>
<line x1="454.0" y1="124.0" x2="454.0" y2="350.0" stroke="#e6eaee" stroke-width="1" stroke-linecap="butt"/>
<line x1="516.0" y1="124.0" x2="516.0" y2="350.0" stroke="#e6eaee" stroke-width="1" stroke-linecap="butt"/>
<line x1="578.0" y1="124.0" x2="578.0" y2="350.0" stroke="#e6eaee" stroke-width="1" stroke-linecap="butt"/>
<line x1="640.0" y1="124.0" x2="640.0" y2="350.0" stroke="#e6eaee" stroke-width="1" stroke-linecap="butt"/>
<line x1="392.0" y1="124.0" x2="392.0" y2="350.0" stroke="#b9c3cc" stroke-width="1.5" stroke-linecap="butt"/>
<line x1="330.0" y1="124.0" x2="330.0" y2="350.0" stroke="#b9c3cc" stroke-width="1.5" stroke-linecap="butt"/>
<text x="330.0" y="370.0" font-size="13" fill="#4f5b66" text-anchor="middle" font-weight="400">0</text>
<text x="392.0" y="370.0" font-size="13" fill="#4f5b66" text-anchor="middle" font-weight="400">0.2</text>
<text x="454.0" y="370.0" font-size="13" fill="#4f5b66" text-anchor="middle" font-weight="400">0.4</text>
<text x="516.0" y="370.0" font-size="13" fill="#4f5b66" text-anchor="middle" font-weight="400">0.6</text>
<text x="578.0" y="370.0" font-size="13" fill="#4f5b66" text-anchor="middle" font-weight="400">0.8</text>
<text x="640.0" y="370.0" font-size="13" fill="#4f5b66" text-anchor="middle" font-weight="400">1.0</text>
<text x="392.0" y="118.0" font-size="13" fill="#4f5b66" text-anchor="middle" font-weight="400">small</text>
<text x="640.0" y="392.0" font-size="13" fill="#4f5b66" text-anchor="end" font-weight="400">further right = more variable in ADHD →</text>
<text x="24.0" y="151.0" font-size="14" fill="#182026" text-anchor="start" font-weight="600">ADHD vs typically developing peers</text>
<text x="24.0" y="185.0" font-size="14" fill="#182026" text-anchor="start" font-weight="400">Children and teenagers</text>
<line x1="330.0" y1="180.0" x2="565.6" y2="180.0" stroke="#257de0" stroke-width="2" stroke-linecap="round"/>
<circle cx="565.6" cy="180.0" r="6" fill="#257de0" stroke="#ffffff" stroke-width="2"/>
<text x="577.6" y="185.0" font-size="14" fill="#182026" text-anchor="start" font-weight="600">g = 0.76</text>
<text x="24.0" y="225.0" font-size="14" fill="#182026" text-anchor="start" font-weight="400">Adults</text>
<line x1="330.0" y1="220.0" x2="472.6" y2="220.0" stroke="#257de0" stroke-width="2" stroke-linecap="round"/>
<circle cx="472.6" cy="220.0" r="6" fill="#257de0" stroke="#ffffff" stroke-width="2"/>
<text x="484.6" y="225.0" font-size="14" fill="#182026" text-anchor="start" font-weight="600">g = 0.46</text>
<text x="24.0" y="261.0" font-size="14" fill="#182026" text-anchor="start" font-weight="600">ADHD vs other clinical conditions</text>
<text x="24.0" y="295.0" font-size="14" fill="#182026" text-anchor="start" font-weight="400">Children</text>
<line x1="330.0" y1="290.0" x2="407.5" y2="290.0" stroke="#257de0" stroke-width="2" stroke-linecap="round"/>
<circle cx="407.5" cy="290.0" r="6" fill="#257de0" stroke="#ffffff" stroke-width="2"/>
