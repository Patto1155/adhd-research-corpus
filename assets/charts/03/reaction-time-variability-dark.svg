<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 446" width="720" height="446" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title id="t">Reaction times vary more in ADHD, but not much more than in other conditions</title>
<desc id="d">Dot plot of Hedges' g for reaction-time variability: 0.76 children vs peers, 0.46 adults vs peers, 0.25 children vs other clinical groups; teenagers and adults not distinguishable from other clinical groups.</desc>
<rect x="0.5" y="0.5" width="719" height="445" rx="8" fill="#191919" stroke="rgba(255,255,255,0.10)"/>
<text x="24.0" y="34.0" font-size="18" fill="#efefef" text-anchor="start" font-weight="600">Reaction times are more variable in ADHD, but only</text>
<text x="24.0" y="58.0" font-size="18" fill="#efefef" text-anchor="start" font-weight="600">slightly more than in other conditions</text>
<text x="24.0" y="84.0" font-size="14" fill="#9c9c9c" text-anchor="start" font-weight="400">Trial-to-trial reaction-time variability, effect size (g), from 319 studies.</text>
<text x="24.0" y="104.0" font-size="14" fill="#9c9c9c" text-anchor="start" font-weight="400">Further right = more variable on average in the ADHD group.</text>
<line x1="392.0" y1="140.0" x2="392.0" y2="366.0" stroke="#303030" stroke-width="1" stroke-linecap="butt"/>
<line x1="454.0" y1="140.0" x2="454.0" y2="366.0" stroke="#303030" stroke-width="1" stroke-linecap="butt"/>
<line x1="516.0" y1="140.0" x2="516.0" y2="366.0" stroke="#303030" stroke-width="1" stroke-linecap="butt"/>
<line x1="578.0" y1="140.0" x2="578.0" y2="366.0" stroke="#303030" stroke-width="1" stroke-linecap="butt"/>
<line x1="640.0" y1="140.0" x2="640.0" y2="366.0" stroke="#303030" stroke-width="1" stroke-linecap="butt"/>
<line x1="392.0" y1="140.0" x2="392.0" y2="366.0" stroke="#474747" stroke-width="1.5" stroke-linecap="butt"/>
<line x1="330.0" y1="140.0" x2="330.0" y2="366.0" stroke="#474747" stroke-width="1.5" stroke-linecap="butt"/>
<text x="330.0" y="386.0" font-size="13" fill="#9c9c9c" text-anchor="middle" font-weight="400">0</text>
<text x="392.0" y="386.0" font-size="13" fill="#9c9c9c" text-anchor="middle" font-weight="400">0.2</text>
<text x="454.0" y="386.0" font-size="13" fill="#9c9c9c" text-anchor="middle" font-weight="400">0.4</text>
<text x="516.0" y="386.0" font-size="13" fill="#9c9c9c" text-anchor="middle" font-weight="400">0.6</text>
<text x="578.0" y="386.0" font-size="13" fill="#9c9c9c" text-anchor="middle" font-weight="400">0.8</text>
<text x="640.0" y="386.0" font-size="13" fill="#9c9c9c" text-anchor="middle" font-weight="400">1.0</text>
<text x="392.0" y="134.0" font-size="13" fill="#9c9c9c" text-anchor="middle" font-weight="400">small</text>
<text x="24.0" y="167.0" font-size="14" fill="#efefef" text-anchor="start" font-weight="600">ADHD vs typically developing peers</text>
<text x="24.0" y="201.0" font-size="14" fill="#efefef" text-anchor="start" font-weight="400">Children and teenagers</text>
<line x1="330.0" y1="196.0" x2="565.6" y2="196.0" stroke="#338ced" stroke-width="2" stroke-linecap="round"/>
<circle cx="565.6" cy="196.0" r="6" fill="#338ced" stroke="#191919" stroke-width="2"/>
<text x="577.6" y="201.0" font-size="13" fill="#efefef" text-anchor="start" font-weight="400">g = 0.76</text>
<text x="24.0" y="241.0" font-size="14" fill="#efefef" text-anchor="start" font-weight="400">Adults</text>
<line x1="330.0" y1="236.0" x2="472.6" y2="236.0" stroke="#338ced" stroke-width="2" stroke-linecap="round"/>
<circle cx="472.6" cy="236.0" r="6" fill="#338ced" stroke="#191919" stroke-width="2"/>
<text x="484.6" y="241.0" font-size="13" fill="#efefef" text-anchor="start" font-weight="400">g = 0.46</text>
<text x="24.0" y="277.0" font-size="14" fill="#efefef" text-anchor="start" font-weight="600">ADHD vs other clinical conditions</text>
<text x="24.0" y="311.0" font-size="14" fill="#efefef" text-anchor="start" font-weight="400">Children</text>
<line x1="330.0" y1="306.0" x2="407.5" y2="306.0" stroke="#338ced" stroke-width="2" stroke-linecap="round"/>
<circle cx="407.5" cy="306.0" r="6" fill="#338ced" stroke="#191919" stroke-width="2"/>
<text x="419.5" y="311.0" font-size="13" fill="#efefef" text-anchor="start" font-weight="400">g = 0.25</text>
<text x="24.0" y="351.0" font-size="14" fill="#efefef" text-anchor="start" font-weight="400">Teenagers and adults</text>
<text x="340.0" y="351.0" font-size="13" fill="#9c9c9c" text-anchor="start" font-weight="400" font-style="italic">could not be told apart</text>
<text x="24.0" y="428.0" font-size="13" fill="#9c9c9c" text-anchor="start" font-weight="400">Source: Kofler et al. 2013, Clinical Psychology Review — see source 1 on this page.</text>
</svg>
