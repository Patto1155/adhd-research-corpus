<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" width="720" height="436" role="img" aria-labelledby="title desc" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>
<title id="title">In two withdrawal trials, more people worsened after switching to placebo</title>
<desc id="desc">Paired bars. Children and adolescents who had taken methylphenidate for more than two years: 40.4% switched to placebo were rated worse, against 15.9% who continued. Adults stable on lisdexamfetamine: 75.0% on placebo relapsed, against 8.9% who continued. Different trials with different definitions of worsening.</desc>
<rect x="0.5" y="0.5" width="719" height="435" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="24.0" y="42.0" font-size="18" font-weight="650" fill="#191919" text-anchor="start">In two withdrawal trials, more people worsened after switching to</text>
<text x="24.0" y="65.4" font-size="18" font-weight="650" fill="#191919" text-anchor="start">placebo</text>
<text x="24.0" y="88.8" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Share who worsened (children) or relapsed (adults) in randomised trials of people already doing well</text>
<text x="24.0" y="108.4" font-size="14" font-weight="400" fill="#666666" text-anchor="start">on a medicine. The two trials define worsening differently.</text>
<rect x="24" y="134.0" width="14" height="14" rx="3" fill="#257de0"/>
<text x="44.0" y="146.0" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Switched to placebo</text>
<rect x="201.84" y="134.0" width="14" height="14" rx="3" fill="#8a8a8a"/>
<text x="221.8" y="146.0" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Continued the medicine</text>
<line x1="254.0" x2="254.0" y1="166.0" y2="284.0" stroke="#c2c2c2" stroke-width="1"/>
<text x="254.0" y="302.0" font-size="13" font-weight="400" fill="#666666" text-anchor="middle">0%</text>
<line x1="334.5" x2="334.5" y1="166.0" y2="284.0" stroke="#e7e7e7" stroke-width="1"/>
<text x="334.5" y="302.0" font-size="13" font-weight="400" fill="#666666" text-anchor="middle">25%</text>
<line x1="415.0" x2="415.0" y1="166.0" y2="284.0" stroke="#e7e7e7" stroke-width="1"/>
<text x="415.0" y="302.0" font-size="13" font-weight="400" fill="#666666" text-anchor="middle">50%</text>
<line x1="495.5" x2="495.5" y1="166.0" y2="284.0" stroke="#e7e7e7" stroke-width="1"/>
<text x="495.5" y="302.0" font-size="13" font-weight="400" fill="#666666" text-anchor="middle">75%</text>
<line x1="576.0" x2="576.0" y1="166.0" y2="284.0" stroke="#e7e7e7" stroke-width="1"/>
<text x="576.0" y="302.0" font-size="13" font-weight="400" fill="#666666" text-anchor="middle">100%</text>
<text x="24.0" y="196.0" font-size="14" font-weight="600" fill="#191919" text-anchor="start">Children, methylphenidate [1]</text>
<path d="M254.00,170.00 H380.09 Q384.09,170.00 384.09,174.00 V184.00 Q384.09,188.00 380.09,188.00 H254.00 Z" fill="#257de0"/>
<text x="392.1" y="184.0" font-size="14" font-weight="600" fill="#191919" text-anchor="start">40.4% </text>
<path d="M254.00,194.00 H301.20 Q305.20,194.00 305.20,198.00 V208.00 Q305.20,212.00 301.20,212.00 H254.00 Z" fill="#8a8a8a"/>
<text x="313.2" y="208.0" font-size="14" font-weight="400" fill="#191919" text-anchor="start">15.9% </text>
<text x="24.0" y="264.0" font-size="14" font-weight="600" fill="#191919" text-anchor="start">Adults, lisdexamfetamine [2]</text>
<path d="M254.00,238.00 H491.50 Q495.50,238.00 495.50,242.00 V252.00 Q495.50,256.00 491.50,256.00 H254.00 Z" fill="#257de0"/>
<text x="503.5" y="252.0" font-size="14" font-weight="600" fill="#191919" text-anchor="start">75.0% </text>
<path d="M254.00,262.00 H278.66 Q282.66,262.00 282.66,266.00 V276.00 Q282.66,280.00 278.66,280.00 H254.00 Z" fill="#8a8a8a"/>
<text x="290.7" y="276.0" font-size="14" font-weight="400" fill="#191919" text-anchor="start">8.9% </text>
<text x="24.0" y="334.0" font-size="14" font-weight="400" fill="#191919" text-anchor="start">Most children who stopped did not clearly worsen. Both trials enrolled people who had already</text>
<text x="24.0" y="353.6" font-size="14" font-weight="400" fill="#191919" text-anchor="start">responded to and tolerated the medicine.</text>
<line x1="24" x2="696" y1="373.2" y2="373.2" stroke="#e7e7e7" stroke-width="1"/>
<text x="24.0" y="394.2" font-size="13" font-weight="400" fill="#666666" text-anchor="start">Sources: Matthijssen et al. [1] (94 children and adolescents aged 8 to 18); Brams et al. [2]. Decisions about</text>
<text x="24.0" y="412.4" font-size="13" font-weight="400" fill="#666666" text-anchor="start">stopping are made with a prescriber.</text>
</svg>
