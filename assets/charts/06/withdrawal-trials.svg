<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 395" width="720" height="395" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title id="t">In two withdrawal trials, more people worsened after switching to placebo</title>
<desc id="d">Paired bars. Children and adolescents who had taken methylphenidate for more than two years: 40.4% switched to placebo were rated worse, against 15.9% who continued. Adults stable on lisdexamfetamine: 75.0% on placebo relapsed, against 8.9% who continued. Different trials with different definitions of worsening.</desc>
<rect x="0.5" y="0.5" width="719" height="394" rx="12" fill="#ffffff" stroke="#dce2e7" stroke-width="1"/>
<text x="24.0" y="40.0" font-size="18" font-weight="600" fill="#182026" text-anchor="start">In two withdrawal trials, more people worsened after switching to placebo</text>
<text x="24.0" y="66.0" font-size="14" font-weight="400" fill="#4f5b66" text-anchor="start">Share who worsened (children) or relapsed (adults) in two randomised trials.</text>
<rect x="24" y="94" width="14" height="14" rx="3" fill="#257de0"/>
<text x="44.0" y="106.0" font-size="14" font-weight="400" fill="#4f5b66" text-anchor="start">Switched to placebo</text>
<rect x="197.07999999999998" y="94" width="14" height="14" rx="3" fill="#8b959e"/>
<text x="217.1" y="106.0" font-size="14" font-weight="400" fill="#4f5b66" text-anchor="start">Continued the medicine</text>
<line x1="254.0" x2="254.0" y1="126.0" y2="244.0" stroke="#b9c3cc" stroke-width="1"/>
<text x="254.0" y="262.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="middle">0%</text>
<line x1="334.5" x2="334.5" y1="126.0" y2="244.0" stroke="#e6eaee" stroke-width="1"/>
<text x="334.5" y="262.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="middle">25%</text>
<line x1="415.0" x2="415.0" y1="126.0" y2="244.0" stroke="#e6eaee" stroke-width="1"/>
<text x="415.0" y="262.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="middle">50%</text>
<line x1="495.5" x2="495.5" y1="126.0" y2="244.0" stroke="#e6eaee" stroke-width="1"/>
<text x="495.5" y="262.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="middle">75%</text>
<line x1="576.0" x2="576.0" y1="126.0" y2="244.0" stroke="#e6eaee" stroke-width="1"/>
<text x="576.0" y="262.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="middle">100%</text>
<text x="24.0" y="156.0" font-size="14" font-weight="600" fill="#182026" text-anchor="start">Children, methylphenidate [1]</text>
<path d="M254.00,130.00 H380.09 Q384.09,130.00 384.09,134.00 V144.00 Q384.09,148.00 380.09,148.00 H254.00 Z" fill="#257de0"/>
<text x="392.1" y="144.0" font-size="14" font-weight="600" fill="#182026" text-anchor="start">40.4% </text>
<path d="M254.00,154.00 H301.20 Q305.20,154.00 305.20,158.00 V168.00 Q305.20,172.00 301.20,172.00 H254.00 Z" fill="#8b959e"/>
<text x="313.2" y="168.0" font-size="14" font-weight="400" fill="#182026" text-anchor="start">15.9% </text>
<text x="24.0" y="224.0" font-size="14" font-weight="600" fill="#182026" text-anchor="start">Adults, lisdexamfetamine [2]</text>
<path d="M254.00,198.00 H491.50 Q495.50,198.00 495.50,202.00 V212.00 Q495.50,216.00 491.50,216.00 H254.00 Z" fill="#257de0"/>
<text x="503.5" y="212.0" font-size="14" font-weight="600" fill="#182026" text-anchor="start">75.0% </text>
<path d="M254.00,222.00 H278.66 Q282.66,222.00 282.66,226.00 V236.00 Q282.66,240.00 278.66,240.00 H254.00 Z" fill="#8b959e"/>
<text x="290.7" y="236.0" font-size="14" font-weight="400" fill="#182026" text-anchor="start">8.9% </text>
<text x="24.0" y="294.0" font-size="14" font-weight="400" fill="#182026" text-anchor="start">Most children who stopped did not clearly worsen. Both trials enrolled people who were already doing</text>
<text x="24.0" y="313.6" font-size="14" font-weight="400" fill="#182026" text-anchor="start">well on, and tolerating, the medicine, and they define worsening differently.</text>
<line x1="24" x2="696" y1="335.2" y2="335.2" stroke="#e6eaee" stroke-width="1"/>
<text x="24.0" y="359.2" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="start">Sources: Matthijssen et al. [1] (94 children and adolescents aged 8 to 18); Brams et al. [2]. Decisions about</text>
<text x="24.0" y="377.2" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="start">stopping are made with a prescriber.</text>
</svg>
