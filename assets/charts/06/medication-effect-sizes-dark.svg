<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 574" width="720" height="574" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title id="t">In short trials, medicines beat placebo on core symptoms, with bigger effects in children than adults</title>
<desc id="d">Dot plot of standardised mean differences (SMD) against placebo at around 12 weeks. Children and teenagers: amphetamines about 1.02 and methylphenidate about 0.78 (network meta-analysis, clinician-rated); methylphenidate 0.74 teacher-rated (Cochrane). Adults: stimulants roughly 0.6 and atomoxetine roughly 0.5 clinician-rated; both about 0.4 self-rated; emotional lability about 0.41. Reference lines mark the conventions 0.2 small, 0.5 medium and 0.8 large.</desc>
<rect x="0.5" y="0.5" width="719" height="573" rx="12" fill="#171c20" stroke="#2a3238" stroke-width="1"/>
<text x="24.0" y="40.0" font-size="18" font-weight="600" fill="#e8edf0" text-anchor="start">In short trials, medicines beat placebo on core</text>
<text x="24.0" y="64.0" font-size="18" font-weight="600" fill="#e8edf0" text-anchor="start">symptoms, with bigger effects in children than adults</text>
<text x="24.0" y="90.0" font-size="14" font-weight="400" fill="#a3aeb7" text-anchor="start">Standardised mean difference (SMD) against placebo, mostly at around 12 weeks.</text>
