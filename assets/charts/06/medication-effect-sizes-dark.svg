<text x="24.0" y="520.0" font-size="13" font-weight="400" fill="#a3aeb7" text-anchor="start">Values marked “about” are rounded on the page. Sources: Cortese et al., Lancet Psychiatry 2018 [1]; Ostinelli</text>
