<text x="24.0" y="531.0" font-size="13" font-weight="400" fill="#9c9c9c" text-anchor="start">Sources: Cortese et al., Lancet Psychiatry 2018 [1]; Ostinelli et al., Lancet Psychiatry 2025 [2]; Storebø et</text>
