<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 591" width="720" height="591" role="img" aria-labelledby="title desc" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>
<title id="title">In short trials, medicines beat placebo on core symptoms, with bigger effects in children than adults</title>
<desc id="desc">Dot plot of standardised mean differences (SMD) against placebo at around 12 weeks. Children and teenagers: amphetamines about 1.02 and methylphenidate about 0.78 (network meta-analysis, clinician-rated); methylphenidate 0.74 teacher-rated (Cochrane). Adults: stimulants roughly 0.6 and atomoxetine roughly 0.5 clinician-rated; both about 0.4 self-rated; emotional lability about 0.41. Reference lines mark the conventions 0.2 small, 0.5 medium and 0.8 large.</desc>
<rect x="0.5" y="0.5" width="719" height="590" rx="8" fill="#191919" stroke="#303030" stroke-width="1"/>
<text x="24.0" y="42.0" font-size="18" font-weight="650" fill="#efefef" text-anchor="start">In short trials, medicines beat placebo on core symptoms, with bigger</text>
<text x="24.0" y="65.4" font-size="18" font-weight="650" fill="#efefef" text-anchor="start">effects in children than adults</text>
<text x="24.0" y="88.8" font-size="14" font-weight="400" fill="#9c9c9c" text-anchor="start">Standardised mean difference (SMD) against placebo, mostly at around 12 weeks. Further right</text>
<text x="24.0" y="108.4" font-size="14" font-weight="400" fill="#9c9c9c" text-anchor="start">means a bigger average effect. Values marked “about” are rounded on the page.</text>
