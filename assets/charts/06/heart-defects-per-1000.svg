<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 469" width="720" height="469" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title id="t">Heart defects per 1,000 births: raw rates differ, the adjusted signal is small and uncertain</title>
<desc id="d">Three grids of 1,000 dots, one per group of births in US Medicaid data, with filled dots for heart defects. Unadjusted rates: 12.7 per 1,000 with no stimulant exposure, 18.8 per 1,000 with methylphenidate, 15.4 per 1,000 with amphetamines. These raw rates do not account for differences between the women. After adjustment, the pooled US and Nordic relative risk for methylphenidate was 1.28 (range 1.00 to 1.64), a possible small increase; for amphetamines in the US data it was 0.96, not linked to more heart defects.</desc>
<defs><pattern id="grid0" x="24.0" y="162" width="5.0" height="5.0" patternUnits="userSpaceOnUse"><g fill="#dde2e7"><circle cx="2.50" cy="2.50" r="1.75"/></g></pattern><clipPath id="frac0"><rect x="84.75" y="162.75" width="2.45" height="3.50"/></clipPath><pattern id="grid2" x="260.0" y="162" width="5.0" height="5.0" patternUnits="userSpaceOnUse"><g fill="#dde2e7"><circle cx="2.50" cy="2.50" r="1.75"/></g></pattern><clipPath id="frac1"><rect x="350.75" y="162.75" width="2.80" height="3.50"/></clipPath><pattern id="grid4" x="496.0" y="162" width="5.0" height="5.0" patternUnits="userSpaceOnUse"><g fill="#dde2e7"><circle cx="2.50" cy="2.50" r="1.75"/></g></pattern><clipPath id="frac2"><rect x="571.75" y="162.75" width="1.40" height="3.50"/></clipPath></defs>
<rect x="0.5" y="0.5" width="719" height="468" rx="12" fill="#ffffff" stroke="#dce2e7" stroke-width="1"/>
<text x="24.0" y="40.0" font-size="18" font-weight="600" fill="#182026" text-anchor="start">Heart defects per 1,000 births: raw rates</text>
<text x="24.0" y="64.0" font-size="18" font-weight="600" fill="#182026" text-anchor="start">differ, the adjusted signal is small and uncertain</text>
<text x="24.0" y="90.0" font-size="14" font-weight="400" fill="#4f5b66" text-anchor="start">Raw rates, early-pregnancy exposure. Each grid is 1,000 births; a dot is one defect.</text>
<text x="24.0" y="131.0" font-size="15" font-weight="600" fill="#182026" text-anchor="start">No stimulant</text>
<text x="24.0" y="151.0" font-size="14" font-weight="400" fill="#4f5b66" text-anchor="start">12.7 per 1,000 (unadjusted)</text>
<rect x="24.0" y="162" width="200.0" height="125.0" fill="url(#grid0)"/>
