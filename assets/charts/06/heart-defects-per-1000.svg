<text x="24.0" y="433.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="start">Source: Huybrechts et al., JAMA Psychiatry 2018 [1]. US Medicaid with Nordic replication. The raw gap is</text>
<text x="24.0" y="451.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="start">larger than the adjusted one because the groups of women differed.</text>
