<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 483" width="720" height="483" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title id="t">New psychosis after starting a stimulant was rare: about 2 in 1,000 with amphetamine</title>
<desc id="d">Two grids of 1,000 dots for 13- to 25-year-olds starting a stimulant in US insurance data. New psychosis treated with an antipsychotic occurred in 0.10% of those starting methylphenidate (1 dot in 1,000) and 0.21% of those starting amphetamine (just over 2 dots in 1,000); hazard ratio 1.65 for amphetamine; about 1 in 660 overall.</desc>
<defs><pattern id="grid0" x="24.0" y="162" width="7.6" height="7.6" patternUnits="userSpaceOnUse"><g fill="#dde2e7"><circle cx="3.80" cy="3.80" r="2.6"/></g></pattern><pattern id="grid1" x="392.0" y="162" width="7.6" height="7.6" patternUnits="userSpaceOnUse"><g fill="#dde2e7"><circle cx="3.80" cy="3.80" r="2.6"/></g></pattern><clipPath id="pfrac1"><rect x="408.40" y="163.20" width="0.52" height="5.20"/></clipPath></defs>
<rect x="0.5" y="0.5" width="719" height="482" rx="12" fill="#ffffff" stroke="#dce2e7" stroke-width="1"/>
<text x="24.0" y="40.0" font-size="18" font-weight="600" fill="#182026" text-anchor="start">New psychosis after starting a stimulant was</text>
<text x="24.0" y="64.0" font-size="18" font-weight="600" fill="#182026" text-anchor="start">rare: about 2 in 1,000 with amphetamine</text>
<text x="24.0" y="90.0" font-size="14" font-weight="400" fill="#4f5b66" text-anchor="start">Each grid is 1,000 people aged 13 to 25 starting a medicine; a filled dot is one case.</text>
<text x="24.0" y="131.0" font-size="15" font-weight="600" fill="#182026" text-anchor="start">Starting methylphenidate</text>
<text x="24.0" y="151.0" font-size="14" font-weight="400" fill="#4f5b66" text-anchor="start">0.10%</text>
<rect x="24.0" y="162" width="304.0" height="190.0" fill="url(#grid0)"/>
<path d="M25.20,165.80a2.6,2.6 0 1,0 5.2,0a2.6,2.6 0 1,0 -5.2,0" fill="#1757ac"/>
<text x="392.0" y="131.0" font-size="15" font-weight="600" fill="#182026" text-anchor="start">Starting amphetamine</text>
<text x="392.0" y="151.0" font-size="14" font-weight="400" fill="#4f5b66" text-anchor="start">0.21%</text>
<rect x="392.0" y="162" width="304.0" height="190.0" fill="url(#grid1)"/>
<path d="M393.20,165.80a2.6,2.6 0 1,0 5.2,0a2.6,2.6 0 1,0 -5.2,0M400.80,165.80a2.6,2.6 0 1,0 5.2,0a2.6,2.6 0 1,0 -5.2,0" fill="#1757ac"/>
<circle cx="411.00" cy="165.80" r="2.6" fill="#1757ac" clip-path="url(#pfrac1)"/>
<text x="24.0" y="382.0" font-size="14" font-weight="400" fill="#182026" text-anchor="start">A case is new psychosis treated with an antipsychotic, in US insurance data. In relative terms: hazard</text>
<text x="24.0" y="401.6" font-size="14" font-weight="400" fill="#182026" text-anchor="start">ratio 1.65 for amphetamine compared with methylphenidate. About 1 in 660 people overall.</text>
<line x1="24" x2="696" y1="423.2" y2="423.2" stroke="#e6eaee" stroke-width="1"/>
<text x="24.0" y="447.2" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="start">Source: Moran et al., N Engl J Med 2019 [8]. Two US insurance cohorts, 221,846 people aged 13 to 25. Young</text>
<text x="24.0" y="465.2" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="start">people only; may not apply to older adults.</text>
</svg>
