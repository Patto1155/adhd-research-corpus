<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 536" width="720" height="536" role="img" aria-labelledby="title desc" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>
<title id="title">How often autism and ADHD overlap depends on who is counted and how</title>
<desc id="desc">Dot plot of pooled estimates. Children and adolescents with ADHD who meet the threshold for autism: 21% overall, 19% in community samples, 24% in clinic samples (22 studies). Autistic people who have ADHD: 28% counting only confirmed clinical diagnoses (2019 meta-analysis), 38.5% currently and 40.2% at some point (2021 meta-analysis of 63 articles). The two main estimates differ by about ten percentage points.</desc>
<rect x="0.5" y="0.5" width="719" height="535" rx="8" fill="#ffffff" stroke="#e7e7e7" stroke-width="1"/>
<text x="24.0" y="42.0" font-size="18" font-weight="650" fill="#191919" text-anchor="start">How often autism and ADHD overlap depends on who is counted and how</text>
<text x="24.0" y="65.4" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Pooled estimates from meta-analyses. Each dot is one estimate; each pooled figure hides a wide</text>
<text x="24.0" y="85.0" font-size="14" font-weight="400" fill="#666666" text-anchor="start">range between studies.</text>
<line x1="324.0" x2="324.0" y1="130.6" y2="360.6" stroke="#c2c2c2" stroke-width="1"/>
<text x="324.0" y="378.6" font-size="13" font-weight="400" fill="#666666" text-anchor="middle">0%</text>
<line x1="392.4" x2="392.4" y1="130.6" y2="360.6" stroke="#e7e7e7" stroke-width="1"/>
<text x="392.4" y="378.6" font-size="13" font-weight="400" fill="#666666" text-anchor="middle">10%</text>
<line x1="460.8" x2="460.8" y1="130.6" y2="360.6" stroke="#e7e7e7" stroke-width="1"/>
<text x="460.8" y="378.6" font-size="13" font-weight="400" fill="#666666" text-anchor="middle">20%</text>
<line x1="529.2" x2="529.2" y1="130.6" y2="360.6" stroke="#e7e7e7" stroke-width="1"/>
<text x="529.2" y="378.6" font-size="13" font-weight="400" fill="#666666" text-anchor="middle">30%</text>
<line x1="597.6" x2="597.6" y1="130.6" y2="360.6" stroke="#e7e7e7" stroke-width="1"/>
<text x="597.6" y="378.6" font-size="13" font-weight="400" fill="#666666" text-anchor="middle">40%</text>
<line x1="666.0" x2="666.0" y1="130.6" y2="360.6" stroke="#e7e7e7" stroke-width="1"/>
<text x="666.0" y="378.6" font-size="13" font-weight="400" fill="#666666" text-anchor="middle">50%</text>
<text x="24.0" y="124.6" font-size="14" font-weight="650" fill="#191919" text-anchor="start">Children with ADHD who meet the autism threshold</text>
<text x="36.0" y="156.6" font-size="14" font-weight="400" fill="#191919" text-anchor="start">All samples [3]</text>
<line x1="324.0" x2="666.0" y1="151.6" y2="151.6" stroke="#e7e7e7" stroke-width="1"/>
<circle cx="467.6" cy="151.6" r="6" fill="#257de0" stroke="#ffffff" stroke-width="2"/>
<text x="455.6" y="156.6" font-size="14" font-weight="600" fill="#191919" text-anchor="end">21%</text>
<text x="36.0" y="186.6" font-size="14" font-weight="400" fill="#191919" text-anchor="start">Community samples [3]</text>
<line x1="324.0" x2="666.0" y1="181.6" y2="181.6" stroke="#e7e7e7" stroke-width="1"/>
<circle cx="454.0" cy="181.6" r="6" fill="#257de0" stroke="#ffffff" stroke-width="2"/>
<text x="442.0" y="186.6" font-size="14" font-weight="600" fill="#191919" text-anchor="end">19%</text>
<text x="36.0" y="216.6" font-size="14" font-weight="400" fill="#191919" text-anchor="start">Clinic samples [3]</text>
<line x1="324.0" x2="666.0" y1="211.6" y2="211.6" stroke="#e7e7e7" stroke-width="1"/>
<circle cx="488.2" cy="211.6" r="6" fill="#257de0" stroke="#ffffff" stroke-width="2"/>
<text x="476.2" y="216.6" font-size="14" font-weight="600" fill="#191919" text-anchor="end">24%</text>
<text x="24.0" y="254.6" font-size="14" font-weight="650" fill="#191919" text-anchor="start">Autistic people who have ADHD</text>
<text x="36.0" y="286.6" font-size="14" font-weight="400" fill="#191919" text-anchor="start">Confirmed clinical diagnoses only [5]</text>
<line x1="324.0" x2="666.0" y1="281.6" y2="281.6" stroke="#e7e7e7" stroke-width="1"/>
<circle cx="515.5" cy="281.6" r="6" fill="#257de0" stroke="#ffffff" stroke-width="2"/>
<text x="503.5" y="286.6" font-size="14" font-weight="600" fill="#191919" text-anchor="end">28%</text>
<text x="36.0" y="316.6" font-size="14" font-weight="400" fill="#191919" text-anchor="start">Currently have ADHD [4]</text>
<line x1="324.0" x2="666.0" y1="311.6" y2="311.6" stroke="#e7e7e7" stroke-width="1"/>
<circle cx="587.3" cy="311.6" r="6" fill="#257de0" stroke="#ffffff" stroke-width="2"/>
<text x="575.3" y="316.6" font-size="14" font-weight="600" fill="#191919" text-anchor="end">38.5%</text>
<text x="36.0" y="346.6" font-size="14" font-weight="400" fill="#191919" text-anchor="start">Have had ADHD at some point [4]</text>
<line x1="324.0" x2="666.0" y1="341.6" y2="341.6" stroke="#e7e7e7" stroke-width="1"/>
<circle cx="599.0" cy="341.6" r="6" fill="#257de0" stroke="#ffffff" stroke-width="2"/>
<text x="587.0" y="346.6" font-size="14" font-weight="600" fill="#191919" text-anchor="end">40.2%</text>
<path d="M525.5,281.6 H690.0 V311.6 H597.3" stroke="#666666" stroke-width="1" fill="none"/>
<text x="24.0" y="414.6" font-size="14" font-weight="400" fill="#191919" text-anchor="start">The two main estimates of ADHD in autistic people (28% and 38.5%) differ by about ten percentage</text>
<text x="24.0" y="434.2" font-size="14" font-weight="400" fill="#191919" text-anchor="start">points, probably because of method (what counts as having ADHD, and who was sampled) rather than</text>
<text x="24.0" y="453.8" font-size="14" font-weight="400" fill="#191919" text-anchor="start">one being wrong.</text>
<line x1="24" x2="696" y1="473.4" y2="473.4" stroke="#e7e7e7" stroke-width="1"/>
<text x="24.0" y="494.4" font-size="13" font-weight="400" fill="#666666" text-anchor="start">Sources: Hollingdale et al., Psychol Med 2020 [3]; Lai et al., Lancet Psychiatry 2019 [5]; Rong et al., Res</text>
<text x="24.0" y="512.6" font-size="13" font-weight="400" fill="#666666" text-anchor="start">Autism Spectr Disord 2021 [4]. Child figures are from children only.</text>
</svg>
