<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 519" width="720" height="519" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title id="t">How often autism and ADHD overlap depends on who is counted and how</title>
<desc id="d">Dot plot of pooled estimates. Children and adolescents with ADHD who meet the threshold for autism: 21% overall, 19% in community samples, 24% in clinic samples (22 studies). Autistic people who have ADHD: 28% counting only confirmed clinical diagnoses (2019 meta-analysis), 38.5% currently and 40.2% at some point (2021 meta-analysis of 63 articles). The two main estimates differ by about ten percentage points.</desc>
<rect x="0.5" y="0.5" width="719" height="518" rx="12" fill="#ffffff" stroke="#dce2e7" stroke-width="1"/>
<text x="24.0" y="40.0" font-size="18" font-weight="600" fill="#182026" text-anchor="start">How often autism and ADHD overlap depends on who is counted and how</text>
<text x="24.0" y="66.0" font-size="14" font-weight="400" fill="#4f5b66" text-anchor="start">Pooled estimates from meta-analyses; each hides a wide range between studies.</text>
<line x1="324.0" x2="324.0" y1="114.0" y2="344.0" stroke="#b9c3cc" stroke-width="1"/>
<text x="324.0" y="362.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="middle">0%</text>
<line x1="392.4" x2="392.4" y1="114.0" y2="344.0" stroke="#e6eaee" stroke-width="1"/>
<text x="392.4" y="362.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="middle">10%</text>
<line x1="460.8" x2="460.8" y1="114.0" y2="344.0" stroke="#e6eaee" stroke-width="1"/>
<text x="460.8" y="362.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="middle">20%</text>
<line x1="529.2" x2="529.2" y1="114.0" y2="344.0" stroke="#e6eaee" stroke-width="1"/>
<text x="529.2" y="362.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="middle">30%</text>
<line x1="597.6" x2="597.6" y1="114.0" y2="344.0" stroke="#e6eaee" stroke-width="1"/>
<text x="597.6" y="362.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="middle">40%</text>
<line x1="666.0" x2="666.0" y1="114.0" y2="344.0" stroke="#e6eaee" stroke-width="1"/>
<text x="666.0" y="362.0" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="middle">50%</text>
<text x="24.0" y="108.0" font-size="14" font-weight="600" fill="#182026" text-anchor="start">Children with ADHD who meet the autism threshold</text>
<text x="36.0" y="140.0" font-size="14" font-weight="400" fill="#182026" text-anchor="start">All samples [3]</text>
<line x1="324.0" x2="666.0" y1="135.0" y2="135.0" stroke="#e6eaee" stroke-width="1"/>
<circle cx="467.6" cy="135.0" r="6" fill="#257de0" stroke="#ffffff" stroke-width="2"/>
<text x="455.6" y="140.0" font-size="14" font-weight="600" fill="#182026" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">21%</text>
<text x="36.0" y="170.0" font-size="14" font-weight="400" fill="#182026" text-anchor="start">Community samples [3]</text>
<line x1="324.0" x2="666.0" y1="165.0" y2="165.0" stroke="#e6eaee" stroke-width="1"/>
<circle cx="454.0" cy="165.0" r="6" fill="#257de0" stroke="#ffffff" stroke-width="2"/>
<text x="442.0" y="170.0" font-size="14" font-weight="600" fill="#182026" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">19%</text>
<text x="36.0" y="200.0" font-size="14" font-weight="400" fill="#182026" text-anchor="start">Clinic samples [3]</text>
<line x1="324.0" x2="666.0" y1="195.0" y2="195.0" stroke="#e6eaee" stroke-width="1"/>
<circle cx="488.2" cy="195.0" r="6" fill="#257de0" stroke="#ffffff" stroke-width="2"/>
<text x="476.2" y="200.0" font-size="14" font-weight="600" fill="#182026" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">24%</text>
<text x="24.0" y="238.0" font-size="14" font-weight="600" fill="#182026" text-anchor="start">Autistic people who have ADHD</text>
<text x="36.0" y="270.0" font-size="14" font-weight="400" fill="#182026" text-anchor="start">Confirmed clinical diagnoses only [5]</text>
<line x1="324.0" x2="666.0" y1="265.0" y2="265.0" stroke="#e6eaee" stroke-width="1"/>
<circle cx="515.5" cy="265.0" r="6" fill="#257de0" stroke="#ffffff" stroke-width="2"/>
<text x="503.5" y="270.0" font-size="14" font-weight="600" fill="#182026" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">28%</text>
<text x="36.0" y="300.0" font-size="14" font-weight="400" fill="#182026" text-anchor="start">Currently have ADHD [4]</text>
<line x1="324.0" x2="666.0" y1="295.0" y2="295.0" stroke="#e6eaee" stroke-width="1"/>
<circle cx="587.3" cy="295.0" r="6" fill="#257de0" stroke="#ffffff" stroke-width="2"/>
<text x="575.3" y="300.0" font-size="14" font-weight="600" fill="#182026" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">38.5%</text>
<text x="36.0" y="330.0" font-size="14" font-weight="400" fill="#182026" text-anchor="start">Have had ADHD at some point [4]</text>
<line x1="324.0" x2="666.0" y1="325.0" y2="325.0" stroke="#e6eaee" stroke-width="1"/>
<circle cx="599.0" cy="325.0" r="6" fill="#257de0" stroke="#ffffff" stroke-width="2"/>
<text x="587.0" y="330.0" font-size="14" font-weight="600" fill="#182026" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">40.2%</text>
<path d="M525.5,265.0 H690.0 V295.0 H597.3" stroke="#4f5b66" stroke-width="1" fill="none"/>
<text x="24.0" y="398.0" font-size="14" font-weight="400" fill="#182026" text-anchor="start">The two main estimates of ADHD in autistic people (28% and 38.5%) differ by about ten percentage</text>
<text x="24.0" y="417.6" font-size="14" font-weight="400" fill="#182026" text-anchor="start">points, probably because of method (what counts as having ADHD, and who was sampled) rather than</text>
<text x="24.0" y="437.2" font-size="14" font-weight="400" fill="#182026" text-anchor="start">one being wrong.</text>
<line x1="24" x2="696" y1="458.8" y2="458.8" stroke="#e6eaee" stroke-width="1"/>
<text x="24.0" y="482.8" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="start">Sources: Hollingdale et al., Psychol Med 2020 [3]; Lai et al., Lancet Psychiatry 2019 [5]; Rong et al., Res</text>
<text x="24.0" y="500.8" font-size="13" font-weight="400" fill="#4f5b66" text-anchor="start">Autism Spectr Disord 2021 [4]. Child figures are from children only.</text>
</svg>
