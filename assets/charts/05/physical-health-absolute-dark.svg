<text x="419.9" y="165.0" font-size="14" font-weight="400" fill="#efefef" text-anchor="start">16.4% </text>
<text x="24.0" y="221.0" font-size="14" font-weight="600" fill="#efefef" text-anchor="start">Obesity, children [3]</text>
<path d="M214.00,195.00 H334.29 Q338.29,195.00 338.29,199.00 V209.00 Q338.29,213.00 334.29,213.00 H214.00 Z" fill="#338ced"/>
<text x="346.3" y="209.0" font-size="14" font-weight="600" fill="#efefef" text-anchor="start">10.3% </text>
