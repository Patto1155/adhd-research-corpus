<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" width="720" height="490" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title id="t">Where absolute figures exist, the gaps are real but modest</title>
<desc id="d">Paired bars, people with ADHD against people without. Obesity in adults 28.2% against 16.4%, and in children 10.3% against 7.4% (meta-analysis of 42 studies). In Swedish adults aged 18 to 64: high blood pressure 8.5% against 4.5%, type 2 diabetes 3.9% against 1.6%.</desc>
<rect x="0.5" y="0.5" width="719" height="489" rx="12" fill="#171c20" stroke="#2a3238" stroke-width="1"/>
<text x="24.0" y="40.0" font-size="18" font-weight="600" fill="#e8edf0" text-anchor="start">Where absolute figures exist, the gaps are real but modest</text>
<text x="24.0" y="66.0" font-size="14" font-weight="400" fill="#a3aeb7" text-anchor="start">Share of people with each condition, with and without ADHD.</text>
<rect x="24" y="94" width="14" height="14" rx="3" fill="#338ced"/>
<text x="44.0" y="106.0" font-size="14" font-weight="400" fill="#a3aeb7" text-anchor="start">With ADHD</text>
<rect x="135.33999999999997" y="94" width="14" height="14" rx="3" fill="#6f7a83"/>
<text x="155.3" y="106.0" font-size="14" font-weight="400" fill="#a3aeb7" text-anchor="start">Without ADHD</text>
<line x1="214.0" x2="214.0" y1="126.0" y2="380.0" stroke="#46515a" stroke-width="1"/>
<text x="214.0" y="398.0" font-size="13" font-weight="400" fill="#a3aeb7" text-anchor="middle">0%</text>
<line x1="334.7" x2="334.7" y1="126.0" y2="380.0" stroke="#283037" stroke-width="1"/>
<text x="334.7" y="398.0" font-size="13" font-weight="400" fill="#a3aeb7" text-anchor="middle">10%</text>
<line x1="455.3" x2="455.3" y1="126.0" y2="380.0" stroke="#283037" stroke-width="1"/>
<text x="455.3" y="398.0" font-size="13" font-weight="400" fill="#a3aeb7" text-anchor="middle">20%</text>
<line x1="576.0" x2="576.0" y1="126.0" y2="380.0" stroke="#283037" stroke-width="1"/>
<text x="576.0" y="398.0" font-size="13" font-weight="400" fill="#a3aeb7" text-anchor="middle">30%</text>
<text x="24.0" y="156.0" font-size="14" font-weight="600" fill="#e8edf0" text-anchor="start">Obesity, adults [3]</text>
<path d="M214.00,130.00 H550.28 Q554.28,130.00 554.28,134.00 V144.00 Q554.28,148.00 550.28,148.00 H214.00 Z" fill="#338ced"/>
<text x="562.3" y="144.0" font-size="14" font-weight="600" fill="#e8edf0" text-anchor="start">28.2% </text>
