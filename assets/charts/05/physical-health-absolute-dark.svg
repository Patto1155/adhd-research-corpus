<text x="311.3" y="236.0" font-size="14" font-weight="400" fill="#e8edf0" text-anchor="start">7.4% </text>
<text x="24.0" y="292.0" font-size="14" font-weight="600" fill="#e8edf0" text-anchor="start">High blood pressure [2]</text>
