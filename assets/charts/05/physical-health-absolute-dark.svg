<text x="24.0" y="454.0" font-size="13" font-weight="400" fill="#a3aeb7" text-anchor="start">Sources: Cortese et al., Am J Psychiatry 2016 [3] (pooled from 42 studies); Chen et al., PLoS One 2018 [2]</text>
<text x="24.0" y="472.0" font-size="13" font-weight="400" fill="#a3aeb7" text-anchor="start">(Swedish adults aged 18 to 64, one point in time). Diagnosed cases only.</text>
