<text x="311.3" y="233.0" font-size="14" font-weight="400" fill="#efefef" text-anchor="start">7.4% </text>
<text x="24.0" y="289.0" font-size="14" font-weight="600" fill="#efefef" text-anchor="start">High blood pressure [2]</text>
