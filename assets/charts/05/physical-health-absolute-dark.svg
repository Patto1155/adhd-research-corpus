<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 488" width="720" height="488" role="img" aria-labelledby="title desc" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>
<title id="title">Where absolute figures exist, the gaps are real but modest</title>
<desc id="desc">Paired bars, people with ADHD against people without. Obesity in adults 28.2% against 16.4%, and in children 10.3% against 7.4% (meta-analysis of 42 studies). In Swedish adults aged 18 to 64: high blood pressure 8.5% against 4.5%, type 2 diabetes 3.9% against 1.6%.</desc>
<rect x="0.5" y="0.5" width="719" height="487" rx="8" fill="#191919" stroke="#303030" stroke-width="1"/>
<text x="24.0" y="42.0" font-size="18" font-weight="650" fill="#efefef" text-anchor="start">Where absolute figures exist, the gaps are real but modest</text>
<text x="24.0" y="65.4" font-size="14" font-weight="400" fill="#9c9c9c" text-anchor="start">Share of people with each condition, with and without ADHD.</text>
<rect x="24" y="91.0" width="14" height="14" rx="3" fill="#338ced"/>
<text x="44.0" y="103.0" font-size="14" font-weight="400" fill="#9c9c9c" text-anchor="start">With ADHD</text>
<rect x="137.86" y="91.0" width="14" height="14" rx="3" fill="#6e6e6e"/>
<text x="157.9" y="103.0" font-size="14" font-weight="400" fill="#9c9c9c" text-anchor="start">Without ADHD</text>
<line x1="214.0" x2="214.0" y1="123.0" y2="377.0" stroke="#474747" stroke-width="1"/>
<text x="214.0" y="395.0" font-size="13" font-weight="400" fill="#9c9c9c" text-anchor="middle">0%</text>
<line x1="334.7" x2="334.7" y1="123.0" y2="377.0" stroke="#303030" stroke-width="1"/>
<text x="334.7" y="395.0" font-size="13" font-weight="400" fill="#9c9c9c" text-anchor="middle">10%</text>
<line x1="455.3" x2="455.3" y1="123.0" y2="377.0" stroke="#303030" stroke-width="1"/>
<text x="455.3" y="395.0" font-size="13" font-weight="400" fill="#9c9c9c" text-anchor="middle">20%</text>
<line x1="576.0" x2="576.0" y1="123.0" y2="377.0" stroke="#303030" stroke-width="1"/>
<text x="576.0" y="395.0" font-size="13" font-weight="400" fill="#9c9c9c" text-anchor="middle">30%</text>
<text x="24.0" y="153.0" font-size="14" font-weight="600" fill="#efefef" text-anchor="start">Obesity, adults [3]</text>
