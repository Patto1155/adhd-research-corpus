<text x="419.9" y="168.0" font-size="14" font-weight="400" fill="#e8edf0" text-anchor="start">16.4% </text>
<text x="24.0" y="224.0" font-size="14" font-weight="600" fill="#e8edf0" text-anchor="start">Obesity, children [3]</text>
<path d="M214.00,198.00 H334.29 Q338.29,198.00 338.29,202.00 V212.00 Q338.29,216.00 334.29,216.00 H214.00 Z" fill="#338ced"/>
<text x="346.3" y="212.0" font-size="14" font-weight="600" fill="#e8edf0" text-anchor="start">10.3% </text>
